<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="emblem" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3a0e12"/>
      <stop offset="55%" stop-color="#1a080b"/>
      <stop offset="100%" stop-color="#0a0507"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a4d"/>
      <stop offset="50%" stop-color="#c81f1f"/>
      <stop offset="100%" stop-color="#7a1216"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff7a6e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 透明背景，仅居中一枚徽标，渲染时位于卡片中部 -->
  <g filter="url(#glow)">
    <circle cx="400" cy="400" r="248" fill="url(#emblem)" stroke="url(#ring)" stroke-width="6"/>
    <circle cx="400" cy="400" r="224" fill="none" stroke="rgba(255,90,77,0.35)" stroke-width="2"/>
  </g>

  <text x="400" y="408" text-anchor="middle" dominant-baseline="middle"
        font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="190" font-weight="700" letter-spacing="8" fill="url(#text)">何俊</text>
  <text x="400" y="512" text-anchor="middle" dominant-baseline="middle"
        font-family="'Space Grotesk',Arial,sans-serif"
        font-size="40" letter-spacing="14" fill="rgba(255,122,110,0.85)">HE JUN</text>
</svg>
